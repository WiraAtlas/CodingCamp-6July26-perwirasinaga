<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="page-wrapper">

    <!-- Page Title -->
    <div class="page-header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle dark/light mode">🌙 Dark Mode</button>
    </div>

    <!-- Balance Card -->
    <div class="card balance-card">
      <p class="balance-label">TOTAL BALANCE</p>
      <h2 class="balance-amount" id="total-balance">$0.00</h2>
    </div>

    <!-- Spending Limit Warning -->
    <div id="limit-warning" class="limit-warning hidden" role="alert"></div>

    <!-- Add Transaction Form -->
    <div class="card form-card">
      <h2 class="card-title">Add Transaction</h2>
      <form id="transaction-form" novalidate>

        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="Enter item name" autocomplete="off" />
          <span class="field-error" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="0.00" min="0" step="0.01" />
          <span class="field-error" id="amount-error"></span>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>

        <!-- Optional extras -->
        <div class="form-group" id="custom-cat-group" style="display:none;">
          <label for="custom-category">Custom Category Name</label>
          <input type="text" id="custom-category" placeholder="Enter category name" />
        </div>

        <div class="form-row-two">
          <div class="form-group">
            <label for="type">Type</label>
            <select id="type">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
          <div class="form-group">
            <label for="spending-limit">Spending Limit <span class="optional">(optional)</span></label>
            <input type="number" id="spending-limit" placeholder="0.00" min="0" step="0.01" />
          </div>
        </div>

        <button type="submit" class="btn-add">Add Transaction</button>
      </form>
    </div>

    <!-- Sort bar -->
    <div class="sort-bar">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="amount-desc">Highest amount</option>
        <option value="amount-asc">Lowest amount</option>
        <option value="category">Category</option>
      </select>
    </div>

    <!-- Bottom two-column grid -->
    <div class="bottom-grid">

      <!-- Transactions -->
      <div class="card list-card">
        <h2 class="card-title">Transactions</h2>
        <ul id="transaction-list" class="transaction-list" aria-live="polite"></ul>
        <p id="list-empty" class="empty-msg">No transactions yet.</p>
      </div>

      <!-- Chart -->
      <div class="card chart-card">
        <h2 class="card-title">Spending by Category</h2>
        <div class="chart-wrap">
          <canvas id="expense-chart" role="img" aria-label="Pie chart of spending by category"></canvas>
        </div>
        <p id="chart-empty" class="empty-msg">No expense data yet.</p>
      </div>

    </div>

  </div><!-- /page-wrapper -->

  <!-- Custom Category Modal -->
  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="add-cat-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <h3 id="modal-heading">Add Custom Category</h3>
    <input type="text" id="modal-cat-input" placeholder="e.g. Healthcare, Bills…" />
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-secondary">Cancel</button>
      <button id="modal-confirm" class="btn-add">Add</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
